<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutorials – The Artisan's Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="headerContainer"></div><div id="mainContainer"></div><div id="footerContainer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function(){
  const header=document.getElementById('headerContainer');
  const main=document.getElementById('mainContainer');
  const footer=document.getElementById('footerContainer');
  AR.renderHeader(header,'Tutorials');

  function card(t){
    return `<article class="card card--tutorial reveal"><div class="card__image"><img src="${AR.imageUrl(t.image,'exhibitions')}" alt="${AR.escapeHtml(t.title)}" loading="lazy"></div><div class="card__content"><h3 class="card__title">${AR.escapeHtml(t.title)}</h3><p class="card__excerpt">${AR.truncate(t.description,90)}</p><a href="tutorial.html?id=${t.id}" class="btn btn--small btn--outline">View Tutorial</a></div></article>`;
  }
  main.innerHTML=`
  <section class="section"><div class="container">
    <header class="page__header"><h1 class="page__title">Learn Art</h1><p class="page__subtitle">Free tutorials for Warli, Gond, Madhubani, Mandala, Landscape and Abstract art.</p></header>
    <div class="grid grid--tutorials">${SEED.tutorials.map(card).join('')}</div>
  </div></section>
  `;
  AR.renderFooter(footer);
})();
</script>
</body>
</html>
