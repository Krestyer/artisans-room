<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In – The Artisan's Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
body{margin:0;font-family:'Poppins',sans-serif;}
.signin__page{height:100vh;background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),url('assets/images/placeholder.svg') center/cover no-repeat;display:flex;align-items:center;justify-content:center;padding:1rem;}
.signin__card{width:100%;max-width:380px;background:rgba(255,255,255,0.1);backdrop-filter:blur(12px);border-radius:15px;padding:2.5rem 2rem;box-shadow:0 8px 32px rgba(0,0,0,0.3);color:#fff;}
.signin__card h1{font-family:'Playfair Display',serif;text-align:center;margin-bottom:0.5rem;font-size:1.75rem;}
.signin__card p{text-align:center;color:rgba(255,255,255,0.9);margin-bottom:1.75rem;font-size:0.95rem;}
.form__group{margin-bottom:1.25rem;}
.form__label{display:block;margin-bottom:0.4rem;font-size:0.9rem;color:#fff;}
.form__input{width:100%;padding:0.75rem 1rem;border-radius:8px;border:none;background:rgba(255,255,255,0.15);color:#fff;font-family:'Poppins',sans-serif;font-size:0.95rem;}
.btn--pink{width:100%;padding:0.85rem;border-radius:8px;border:none;background:linear-gradient(135deg,#ff7eb3,#ff758c);color:#fff;font-weight:600;font-size:1rem;cursor:pointer;}
.btn--pink:hover{opacity:0.95;}
.signup__link{text-align:center;margin-top:1.25rem;font-size:0.9rem;color:rgba(255,255,255,0.9);}
.signup__link a{color:#ffb7ce;text-decoration:none;font-weight:600;}
.signup__link a:hover{text-decoration:underline;}
.alert--error{background:rgba(255,0,0,0.15);border:1px solid rgba(255,0,0,0.4);color:#ffb3b3;padding:0.75rem;border-radius:8px;margin-bottom:1.25rem;font-size:0.9rem;}
</style>
</head>
<body>
<div class="signin__page">
  <div class="signin__card">
    <div id="flashBox"></div>
    <h1>Welcome Back</h1>
    <p>Sign in to your account to explore art, book exhibitions, and manage orders.</p>
    <form id="signinForm" novalidate>
      <div class="form__group"><label class="form__label">Email</label><input type="email" name="email" class="form__input" placeholder="you@example.com" required></div>
      <div class="form__group"><label class="form__label">Password</label><input type="password" name="password" class="form__input" placeholder="••••••••" required></div>
      <button type="submit" class="btn--pink">Sign In</button>
    </form>
    <p class="signup__link">Don't have an account? <a href="signup.html">Sign up here</a></p>
  </div>
</div>
<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function(){
  const box=document.getElementById('flashBox');
  AR.showFlashes('flashBox');
  document.getElementById('signinForm').onsubmit=function(ev){
    ev.preventDefault();
    const email=this.elements['email'].value.trim();
    const pass=this.elements['password'].value;
    const users = AR.get('ar_users',[]);
    const u = users.find(x=>x.email===email);
    if(!u || u.password!==pass){ AR.flash('error','Invalid email or password.'); AR.showFlashes('flashBox'); return; }
    AR.setSession(u);
    AR.flash('success','Welcome back, '+AR.escapeHtml(u.name)+'!');
    location = u.role==='admin'?'admin/index.html':'dashboard.html';
  };
})();
</script>
</body>
</html>
