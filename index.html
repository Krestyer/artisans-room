<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home – The Artisan's Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="headerContainer"></div>
<div id="mainContainer"></div>
<div id="footerContainer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function(){
  const header = document.getElementById('headerContainer');
  const main = document.getElementById('mainContainer');
  const footer = document.getElementById('footerContainer');
  AR.renderHeader(header, 'Home');

  const featured = SEED.artworks.filter(a=>a.featured).slice(0,4);
  const upcoming = SEED.exhibitions.filter(e=> new Date(e.exhibition_date) >= new Date()).slice(0,3);
  const artists = SEED.artists.slice(0,3);

  function cardArtwork(a){
    const artist = SEED.artists.find(x=>x.id===a.artist_id);
    return `<article class="card card--artwork reveal"><div class="card__image"><img src="${AR.imageUrl(a.image,'artworks')}" alt="${AR.escapeHtml(a.title)}" loading="lazy"><span class="card__badge">${AR.escapeHtml(a.category)}</span></div><div class="card__content"><h3 class="card__title">${AR.escapeHtml(a.title)}</h3><p class="card__artist">by ${AR.escapeHtml(artist?artist.name:'')}</p><p class="card__price">${AR.fmtPrice(a.price)}</p><a href="artwork.html?id=${a.id}" class="btn btn--small btn--outline">View Artwork</a></div></article>`;
  }
  function cardExhibition(e){
    return `<article class="card card--exhibition reveal"><div class="card__image"><img src="${AR.imageUrl(e.image,'exhibitions')}" alt="${AR.escapeHtml(e.name)}" loading="lazy"></div><div class="card__content"><h3 class="card__title">${AR.escapeHtml(e.name)}</h3><p class="card__meta"><i class="fas fa-calendar"></i> ${new Date(e.exhibition_date).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</p><p class="card__meta"><i class="fas fa-map-marker-alt"></i> ${AR.escapeHtml(e.venue)}</p><p class="card__price">${AR.fmtPrice(e.ticket_price)} per ticket</p><p class="card__excerpt">${AR.truncate(e.description,90)}</p><p class="text-muted small">Seats: ${e.available_seats}/${e.total_seats}</p><a href="exhibition.html?id=${e.id}" class="btn btn--small btn--outline">View Details</a></div></article>`;
  }
  function cardArtist(ar){
    return `<article class="card card--artist reveal"><div class="card__image"><img src="${AR.imageUrl(ar.photo,'artists')}" alt="${AR.escapeHtml(ar.name)}" loading="lazy"></div><div class="card__content"><h3 class="card__title">${AR.escapeHtml(ar.name)}</h3><p class="card__artist">${AR.escapeHtml(ar.art_style)}</p><p class="card__excerpt">${AR.truncate(ar.bio,90)}</p><a href="artist-profile.html?id=${ar.id}" class="btn btn--small btn--outline">View Profile</a></div></article>`;
  }

  main.innerHTML = `
  <section class="hero reveal">
    <div class="hero__content">
      <h1 class="hero__title">Welcome to The Artisan's Room</h1>
      <p class="hero__tagline">Our gallery showcases exceptional works from talented creators worldwide. Find inspiration and bring home art that speaks to your soul.</p>
      <div class="hero__actions">
        <a href="artworks.html" class="btn btn--primary btn--large">Explore Now</a>
        <a href="signin.html" class="btn btn--outline btn--large">Sign In</a>
      </div>
    </div>
  </section>
  <section class="section reveal" id="featured-artworks">
    <div class="container"><header class="section__header"><h2 class="section__title">Featured Artworks</h2><a href="artworks.html" class="section__more">View all artworks <i class="fas fa-arrow-right"></i></a></header>
      <div class="grid grid--artworks">${featured.map(cardArtwork).join('')}</div></div></section>
  <section class="section section--alt reveal" id="upcoming-exhibitions">
    <div class="container"><header class="section__header"><h2 class="section__title">Upcoming Exhibitions</h2><a href="exhibitions.html" class="section__more">View all exhibitions <i class="fas fa-arrow-right"></i></a></header>
      <div class="grid grid--exhibitions">${upcoming.map(cardExhibition).join('')}</div></div></section>
  <section class="section reveal" id="featured-artists">
    <div class="container"><header class="section__header"><h2 class="section__title">Featured Artists</h2><a href="artists.html" class="section__more">View all artists <i class="fas fa-arrow-right"></i></a></header>
      <div class="grid grid--artists">${artists.map(cardArtist).join('')}</div></div></section>
  `;
  AR.renderFooter(footer);
})();
</script>
</body>
</html>
