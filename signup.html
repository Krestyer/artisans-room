<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up – The Artisan's Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="headerContainer"></div><div id="flashContainer"></div><div id="mainContainer"></div><div id="footerContainer"></div>
<style>
body{margin:0;font-family:'Poppins',sans-serif;background:#f8f5f0;}
.signup__wrapper{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;}
.signup__card{width:100%;max-width:420px;background:#fff;border-radius:15px;padding:2.5rem 2rem;box-shadow:0 10px 40px rgba(0,0,0,0.08);}
.signup__card h1{font-family:'Playfair Display',serif;text-align:center;margin-bottom:0.5rem;color:#2d2d2d;}
.signup__card p{text-align:center;color:#666;margin-bottom:1.75rem;font-size:0.95rem;}
.form__group{margin-bottom:1.25rem;}
.form__label{display:block;margin-bottom:0.4rem;font-size:0.9rem;color:#333;font-weight:500;}
.form__input{width:100%;padding:0.75rem 1rem;border-radius:8px;border:1px solid #ddd;background:#fff;color:#333;font-family:'Poppins',sans-serif;font-size:0.95rem;}
.btn--primary{width:100%;padding:0.85rem;border-radius:8px;border:none;background:#2d2d2d;color:#fff;font-weight:600;font-size:1rem;cursor:pointer;}
.btn--primary:hover{background:#1a1a1a;}
.login__link{text-align:center;margin-top:1.25rem;font-size:0.9rem;color:#666;}
.login__link a{color:#d4a373;text-decoration:none;font-weight:600;}
.login__link a:hover{text-decoration:underline;}
.error-msg{background:#fdecea;border:1px solid #f5c6c6;color:#b32323;padding:0.75rem;border-radius:8px;margin-bottom:1.25rem;font-size:0.9rem;}
</style>
</head>
<body>
<div class="signup__wrapper">
  <div class="signup__card">
    <div id="flashBox"></div>
    <h1>Create Account</h1>
    <p>Join The Artisan's Room to collect art, book exhibitions, and track your orders.</p>
    <form id="signupForm" novalidate>
      <div class="form__group"><label class="form__label">Full Name</label><input type="text" name="name" class="form__input" placeholder="Vishal Shukla" required></div>
      <div class="form__group"><label class="form__label">Email</label><input type="email" name="email" class="form__input" placeholder="you@example.com" required></div>
      <div class="form__group"><label class="form__label">Phone</label><input type="tel" name="phone" class="form__input" placeholder="+91 98765 43210"></div>
      <div class="form__group"><label class="form__label">Password <span style="font-size:0.8rem;color:#888;">(min 8 characters)</span></label><input type="password" name="password" class="form__input" placeholder="••••••••" required></div>
      <div class="form__group"><label class="form__label">Confirm Password</label><input type="password" name="confirm_password" class="form__input" placeholder="••••••••" required></div>
      <button type="submit" class="btn--primary">Sign Up</button>
    </form>
    <p class="login__link">Already have an account? <a href="signin.html">Sign in</a></p>
  </div>
</div>
<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function(){
  AR.showFlashes('flashBox');
  document.getElementById('signupForm').onsubmit=function(ev){
    ev.preventDefault();
    const name=this.elements['name'].value.trim();
    const email=this.elements['email'].value.trim();
    const pass=this.elements['password'].value;
    const confirm=this.elements['confirm_password'].value;
    const phone=this.elements['phone'].value.trim();
    const users = AR.get('ar_users',[]);
    if(!name||!email||!pass||!confirm){ AR.flash('error','Please fill in all fields.'); AR.showFlashes('flashBox'); return; }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ AR.flash('error','Enter a valid email.'); AR.showFlashes('flashBox'); return; }
    if(pass.length<8){ AR.flash('error','Password must be at least 8 characters.'); AR.showFlashes('flashBox'); return; }
    if(pass!==confirm){ AR.flash('error','Passwords do not match.'); AR.showFlashes('flashBox'); return; }
    if(users.find(x=>x.email===email)){ AR.flash('error','This email is already registered.'); AR.showFlashes('flashBox'); return; }
    const u = {id:Date.now(), name, email, password:pass, phone, role:'user', last_login:null, created_at:new Date().toISOString()};
    users.push(u); AR.set('ar_users',users);
    AR.flash('success','Account created! Please sign in.');
    location='signin.html';
  };
})();
</script>
</body>
</html>
