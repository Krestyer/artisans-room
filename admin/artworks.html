<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Artworks – Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="admin">
<div id="adminShell"></div>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/common.js"></script>
<script>
(function(){
  const u = JSON.parse(localStorage.getItem('ar_session')||'null');
  if(!u || u.role!=='admin'){ location='login.html'; return; }
  const shell=document.getElementById('adminShell');
  const artworks = JSON.parse(localStorage.getItem('ar_artworks')||JSON.stringify(SEED.artworks));
  const artists = SEED.artists;

  shell.innerHTML=`
  <div class="admin__wrapper">
    <aside class="admin__sidebar"><h2>The Artisan's Room</h2><ul>
      <li><a href="index.html"><i class="fas fa-chart-pie"></i> Dashboard</a></li>
      <li><a href="artworks.html" class="active"><i class="fas fa-palette"></i> Artworks</a></li>
      <li><a href="artists.html"><i class="fas fa-user"></i> Artists</a></li>
      <li><a href="exhibitions.html"><i class="fas fa-calendar"></i> Exhibitions</a></li>
      <li><a href="tutorials.html"><i class="fas fa-book"></i> Tutorials</a></li>
      <li><a href="products.html"><i class="fas fa-box"></i> Products</a></li>
      <li><a href="users.html"><i class="fas fa-users"></i> Users</a></li>
      <li><a href="orders.html"><i class="fas fa-shopping-bag"></i> Orders</a></li>
      <li><a href="bookings.html"><i class="fas fa-ticket-alt"></i> Bookings</a></li>
      <li><a href="messages.html"><i class="fas fa-envelope"></i> Messages</a></li>
      <li><a href="logout.html" style="color:#ffb3b3;"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
    </ul></aside>
    <main class="admin__main">
      <header class="admin__header"><h1>Manage Artworks</h1><a href="artworks-form.html" class="admin__btn">+ Add Artwork</a><a href="logout.html" class="admin__btn" style="background:#b32323;"><i class="fas fa-sign-out-alt"></i> Logout</a></header>
      <table class="admin__table"><thead><tr><th>Image</th><th>Title</th><th>Artist</th><th>Category</th><th>Price</th><th>Sale</th><th>Featured</th><th>Actions</th></tr></thead><tbody>
      ${artworks.map(a=>{const ar=artists.find(x=>x.id===a.artist_id);return `<tr><td><img src="../assets/images/placeholder.svg" alt="" style="width:45px;height:45px;object-fit:cover;border-radius:6px;"></td><td>${a.title}</td><td>${ar?ar.name:''}</td><td>${a.category}</td><td>₹${Number(a.price).toFixed(2)}</td><td>${a.is_for_sale?'Yes':'No'}</td><td>${a.featured?'Yes':'No'}</td><td><a href="artworks-form.html?id=${a.id}" class="btn--admin btn--admin--edit">Edit</a> <button class="btn--admin btn--admin--delete" onclick="if(confirm('Delete?')){const l=artworks.filter(x=>x.id!==${a.id});localStorage.setItem('ar_artworks',JSON.stringify(l));location.reload();}">Delete</button></td></tr>`;}).join('')}
      </tbody></table>
    </main>
  </div>
  `;
})();
</script>
</body>
</html>
