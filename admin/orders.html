<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Orders – Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="admin">
<div id="adminShell"></div>
<script>
(function(){
  const u = JSON.parse(localStorage.getItem('ar_session')||'null');
  if(!u || u.role!=='admin'){ location='login.html'; return; }
  const shell=document.getElementById('adminShell');
  const orders = JSON.parse(localStorage.getItem('ar_orders')||'[]');
  const users = JSON.parse(localStorage.getItem('ar_users')||'[]');
  const statuses = ['Pending','Confirmed','Shipped','Delivered','Cancelled'];
  shell.innerHTML=`
  <div class="admin__wrapper">
    <aside class="admin__sidebar"><h2>The Artisan's Room</h2><ul>
      <li><a href="index.html"><i class="fas fa-chart-pie"></i> Dashboard</a></li>
      <li><a href="artworks.html"><i class="fas fa-palette"></i> Artworks</a></li>
      <li><a href="artists.html"><i class="fas fa-user"></i> Artists</a></li>
      <li><a href="exhibitions.html"><i class="fas fa-calendar"></i> Exhibitions</a></li>
      <li><a href="tutorials.html"><i class="fas fa-book"></i> Tutorials</a></li>
      <li><a href="products.html"><i class="fas fa-box"></i> Products</a></li>
      <li><a href="users.html"><i class="fas fa-users"></i> Users</a></li>
      <li><a href="orders.html" class="active"><i class="fas fa-shopping-bag"></i> Orders</a></li>
      <li><a href="bookings.html"><i class="fas fa-ticket-alt"></i> Bookings</a></li>
      <li><a href="messages.html"><i class="fas fa-envelope"></i> Messages</a></li>
      <li><a href="logout.html" style="color:#ffb3b3;"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
    </ul></aside>
    <main class="admin__main">
      <header class="admin__header"><h1>Manage Orders</h1><a href="logout.html" class="admin__btn" style="background:#b32323;"><i class="fas fa-sign-out-alt"></i> Logout</a></header>
      <table class="admin__table"><thead><tr><th>Order #</th><th>Customer</th><th>Total</th><th>Method</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead><tbody>
      ${orders.map(o=>{const usr=users.find(x=>x.id===o.user_id);return `<tr><td>#${String(o.id).padStart(6,'0')}</td><td>${usr?usr.name:''}</td><td>₹${Number(o.total_amount).toFixed(2)}</td><td>${o.payment_method}</td><td><form style="display:inline;"><select onchange="if(confirm('Update status?')){const l=JSON.parse(localStorage.getItem('ar_orders')||'[]');const it=l.find(x=>x.id===${o.id});it.status=this.value;localStorage.setItem('ar_orders',JSON.stringify(l));location.reload();}">${statuses.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></form></td><td>${new Date(o.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</td><td><a href="../order-success.html?id=${o.id}" target="_blank" class="btn--admin btn--admin--edit" style="padding:0.3rem 0.6rem;font-size:0.85rem;">View</a></td></tr>`;}).join('')}
      </tbody></table>
    </main>
  </div>
  `;
})();
</script>
</body>
</html>
