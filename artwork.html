<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artwork – The Artisan's Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="headerContainer"></div><div id="flashContainer"></div><div id="mainContainer"></div><div id="footerContainer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function(){
  const header=document.getElementById('headerContainer');
  const main=document.getElementById('mainContainer');
  const footer=document.getElementById('footerContainer');
  AR.renderHeader(header,'Artwork');
  AR.showFlashes('flashContainer');

  const id = parseInt(new URLSearchParams(location.search).get('id')||'0',10);
  const a = SEED.artworks.find(x=>x.id===id);
  if(!a){ main.innerHTML='<div class="container"><h1>Not Found</h1><p>Artwork not found.</p><p><a href="artworks.html">Go to gallery</a></p></div>'; AR.renderFooter(footer); return; }
  const artist = SEED.artists.find(x=>x.id===a.artist_id);

  main.innerHTML=`
  <section class="section"><div class="container">
    <div class="detail__layout">
      <div class="detail__image"><img src="${AR.imageUrl(a.image,'artworks')}" alt="${AR.escapeHtml(a.title)}" class="detail__img" loading="lazy">${a.is_for_sale?'<div class="detail__tag detail__tag--sale">For Sale</div>':''}</div>
      <div class="detail__info">
        <h1 class="detail__title">${AR.escapeHtml(a.title)}</h1>
        <p class="detail__artist">by <a href="artist-profile.html?id=${artist.id}">${AR.escapeHtml(artist.name)}</a></p>
        <p class="detail__category">${AR.escapeHtml(a.category)}</p>
        <p class="detail__price">${AR.fmtPrice(a.price)}</p>
        <p class="detail__desc">${AR.escapeHtml(a.description)}</p>
        ${a.is_for_sale?`<form id="addForm" class="detail__actions"><input type="hidden" name="id" value="${a.id}"><button type="submit" class="btn btn--primary btn--large">Add to Cart</button></form>`:'<p class="text-muted">Not available for purchase.</p>'}
        <a href="artworks.html" class="btn btn--outline btn--small">Back to Gallery</a>
      </div>
    </div>
  </div></section>
  `;
  AR.renderFooter(footer);

  document.getElementById('addForm').onsubmit=function(e){
    e.preventDefault();
    AR.addToCart({type:'artwork', id:a.id, name:a.title, price:a.price, image:a.image, qty:1});
    AR.flash('success', AR.escapeHtml(a.title)+' added to cart.');
    location='cart.html';
  };
})();
</script>
</body>
</html>
