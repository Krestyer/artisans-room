<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exhibition – The Artisan's Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="headerContainer"></div><div id="flashContainer"></div><div id="mainContainer"></div><div id="footerContainer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function(){
  const header=document.getElementById('headerContainer');
  const main=document.getElementById('mainContainer');
  const footer=document.getElementById('footerContainer');
  AR.renderHeader(header,'Exhibition');
  AR.showFlashes('flashContainer');

  const id = parseInt(new URLSearchParams(location.search).get('id')||'0',10);
  const e = SEED.exhibitions.find(x=>x.id===id);
  if(!e){ main.innerHTML='<div class="container"><h1>Not Found</h1><p>Exhibition not found.</p><p><a href="exhibitions.html">Go to exhibitions</a></p></div>'; AR.renderFooter(footer); return; }

  main.innerHTML=`
  <section class="section"><div class="container">
    <div class="detail__layout">
      <div class="detail__image"><img src="${AR.imageUrl(e.image,'exhibitions')}" alt="${AR.escapeHtml(e.name)}" class="detail__img" loading="lazy"></div>
      <div class="detail__info">
        <h1 class="detail__title">${AR.escapeHtml(e.name)}</h1>
        <p class="detail__meta"><i class="fas fa-calendar"></i> ${new Date(e.exhibition_date).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}</p>
        <p class="detail__meta"><i class="fas fa-map-marker-alt"></i> ${AR.escapeHtml(e.venue)}</p>
        <p class="detail__price">${AR.fmtPrice(e.ticket_price)} per ticket</p>
        <p class="detail__desc">${AR.escapeHtml(e.description)}</p>
        <p class="text-muted">Seats available: <strong>${e.available_seats}</strong> of ${e.total_seats}</p>
        ${!AR.isLoggedIn()?'<div class="alert alert--info">Please <a href="signin.html">sign in</a> to book tickets.</div>':`
        <form id="bookForm" class="detail__actions" onsubmit="return confirm('Book tickets?')">
          <label class="form__label">Number of tickets</label>
          <select name="tickets" class="form__select" required>${[...Array(Math.min(10,e.available_seats)).keys()].map(i=>`<option value="${i+1}">${i+1}</option>`).join('')}</select>
          <button type="submit" class="btn btn--primary btn--large">Book Tickets</button>
        </form>
        `}
        <a href="exhibitions.html" class="btn btn--outline btn--small">Back to Exhibitions</a>
      </div>
    </div>
  </div></section>
  `;
  AR.renderFooter(footer);

  document.getElementById('bookForm').onsubmit=function(ev){
    ev.preventDefault();
    if(!AR.isLoggedIn()){ location='signin.html'; return; }
    const t = parseInt(this.elements['tickets'].value,10);
    if(t<1||t>e.available_seats){ AR.flash('error','Invalid ticket count.'); return; }
    const total = t*e.ticket_price;
    const u = AR.currentUser();
    const bookings = AR.get('ar_bookings',[]);
    bookings.push({id:Date.now(), user_id:u.id, exhibition_id:e.id, tickets:t, total_amount:total, status:'Confirmed', created_at:new Date().toISOString()});
    AR.set('ar_bookings',bookings);
    e.available_seats -= t;
    AR.flash('success', t+' ticket(s) booked for '+AR.escapeHtml(e.name)+'.');
    location='dashboard.html';
  };
})();
</script>
</body>
</html>
