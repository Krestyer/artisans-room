<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product – The Artisan's Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="headerContainer"></div><div id="flashContainer"></div><div id="mainContainer"></div><div id="footerContainer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function(){
  const header=document.getElementById('headerContainer');
  const main=document.getElementById('mainContainer');
  const footer=document.getElementById('footerContainer');
  AR.renderHeader(header,'Product');
  AR.showFlashes('flashContainer');

  const id = parseInt(new URLSearchParams(location.search).get('id')||'0',10);
  const p = SEED.products.find(x=>x.id===id);
  if(!p){ main.innerHTML='<div class="container"><h1>Not Found</h1><p>Product not found.</p><p><a href="shop.html">Go to shop</a></p></div>'; AR.renderFooter(footer); return; }

  main.innerHTML=`
  <section class="section"><div class="container">
    <div class="detail__layout">
      <div class="detail__image"><img src="${AR.imageUrl(p.image,'products')}" alt="${AR.escapeHtml(p.name)}" class="detail__img" loading="lazy"></div>
      <div class="detail__info">
        <h1 class="detail__title">${AR.escapeHtml(p.name)}</h1>
        <p class="detail__category">${AR.escapeHtml(p.category)}</p>
        <p class="detail__price">${AR.fmtPrice(p.price)}</p>
        <p class="detail__desc">${AR.escapeHtml(p.description)}</p>
        <p class="text-muted">Stock: <strong>${p.stock}</strong></p>
        ${p.stock>0?`<form id="addForm" class="detail__actions"><input type="hidden" name="id" value="${p.id}"><button type="submit" class="btn btn--primary btn--large">Add to Cart</button></form>`:'<p class="text-muted">Out of stock.</p>'}
        <a href="shop.html" class="btn btn--outline btn--small">Back to Shop</a>
      </div>
    </div>
  </div></section>
  `;
  AR.renderFooter(footer);
  document.getElementById('addForm').onsubmit=function(ev){
    ev.preventDefault();
    AR.addToCart({type:'product', id:p.id, name:p.name, price:p.price, image:p.image, qty:1});
    AR.flash('success', AR.escapeHtml(p.name)+' added to cart.');
    location='cart.html';
  };
})();
</script>
</body>
</html>
